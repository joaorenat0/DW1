<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>
<body>
    <h1>Demonstração de CSS Inline</h1>
    <p style="color: rgb(6, 6, 58); font-size: 24px;">Este paragráfo utiliza CSS inine através do atribuo style.</p>
    
    <p 
    style="color: rgb(148, 25, 25); 
    font-weight: bold;
    background-color: rgb(219, 219, 95);"
    >Outro parágrafo com múltiplas propriedades CSS inline</p>
    
    <!-- Padding espaçamento interno, margin espaçamento externo -->
    <div style="border: 2px solid green; width: 400px; padding: 30px; margin: 50px;">
        Está é uma div estilizada com CSS inline

    </div>

    <h2 style="color: #774af5; text-align: center;">
        Título centralizado com hexadecimal
    </h2>
<div style="width: 600px; height: 400px; background-color: orange; color: white;"
</body>
</html>
