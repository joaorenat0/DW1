<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão Dropdown com Bootstrap</title>
     <!-- Importação do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Botão Dropdown com Bootstrap</h1>

    <div class="dropdown">
        <!-- Botão que aciona o menu -->
        <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Menu</button>
        <!-- Opções do menu -->
         <div class="dropdown-menu">
            <h2 class="dropdown-header">Produtos</h2>
            <a href="#" class="dropdown-item">Computadores</a>
            <a href="#" class="dropdown-item">Celulares</a>
            <hr class="dropdown-divider">
            <h2 class="dropdown-header">Serviços</h2>
            <a href="#" class="dropdown-item">Desenvolvimento Web</a>
            <a href="#" class="dropdown-item">Desenvolvimento de aplicativos móveis</a>
         </div>
    </div>
   <!-- Importação do JavaScript do Bootstrap -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
