<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
   <h1>Formulários no HTML5</h1>
   <form action="/cadastrar" method="POST">
    <label for="nome"> Insira seu nome:</label><br>
    <!-- Input text -->
    <input type="text" id="nome" placeholder="Insiria seu nome completo"><br>
    <!-- Input email -->
     <label for="email">E-mail:</label><br>
    <input type="email" id="email" placeholder="Insira seu email..."><br>
    <!-- Input password -->
     <label for="senha"> Senha:</label><br>
    <input type="password" id="senha" placeholder="Insira sua senha"><br>
   </form> 
</body>
</html>
