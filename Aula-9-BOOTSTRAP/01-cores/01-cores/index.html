<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes de cores no Bootstrap</title>

     <!-- Importação do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <h1>Cores no Bootstrap</h1>

    <p class="h3 text-muted">muted</p>
    <p class="h3 text-primary">primary</p>
    <p class="h3 text-sucess">sucess</p>
    <p class="h3 text-info">info</p>
    <p class="h3 text-warning">warning</p>
    <p class="h3 text-danger">danger</p>
    <p class="h3 text-secondary">secondary</p>
    <p class="h3 text-dark">dark</p>
    <p class="h3 text-light bg-sucess">light</p>
    <!-- Aplicando 50% de opacidadae no texto branco fundo vermelho -->
    <p class="h2 text-white-50 bg-danger">alterando a opacidade</p>
    <hr>
    <h1>Botões no Bootstrap</h1>
    <button type="button" class="btn">Normal</button><br><br>
    <button type="button" class="btn btn-primary">Primário</button><br> <br>
    <button type="button" class="btn btn-secondary">Secundário</button><br><br>
    <button type="button" class="btn btn-sucess">Sucesso</button><br><br>
    <button type="button" class="btn btn-info">Informação</button><br><br>
    <button type="button" class="btn btn-warning">Alerta</button><br><br>
    <button type="button" class="btn btn-danger">Perigo</button><br><br>
    <button type="button" class="btn btn-dark">Escuro</button><br><br>
    <button type="button" class="btn btn-light">Claro</button><br><br>

    
    <!-- Importação do JavaScript do Bootstrap -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
